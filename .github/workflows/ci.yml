name: CI

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Format check
        run: |
          if command -v black &> /dev/null && pip show black &> /dev/null; then
            black --check .
          else
            echo "black not configured — skipping format check"
          fi

      - name: Import sort check
        run: |
          if command -v isort &> /dev/null && pip show isort &> /dev/null; then
            isort --check-only .
          else
            echo "isort not configured — skipping import sort check"
          fi

      - name: Lint
        run: |
          if command -v ruff &> /dev/null && pip show ruff &> /dev/null; then
            ruff check .
          elif [ -f .flake8 ]; then
            flake8 .
          else
            echo "no linter configured — skipping lint"
          fi

      - name: Type check
        run: |
          if command -v mypy &> /dev/null && pip show mypy &> /dev/null; then
            mypy .
          elif [ -f pyrightconfig.json ]; then
            npx pyright .
          else
            echo "no type checker configured — skipping type check"
          fi

      - name: Validate migrations
        run: |
          MIGRATION_DIR="services/persistence/migrations"
          if [ -d "$MIGRATION_DIR" ]; then
            echo "Migration directory exists: $MIGRATION_DIR"
            MIGRATIONS=$(ls "$MIGRATION_DIR"/*.sql 2>/dev/null | sort)
            if [ -n "$MIGRATIONS" ]; then
              echo "Found migrations:"
              echo "$MIGRATIONS"
              for f in $MIGRATIONS; do
                BASENAME=$(basename "$f")
                if echo "$BASENAME" | grep -qP '^\d{3}_[a-z_]+\.sql$'; then
                  echo "  ✅ $BASENAME (valid name)"
                else
                  echo "  ⚠️  $BASENAME (name does not match NNN_name.sql convention)"
                fi
              done
            else
              echo "No SQL migration files found"
            fi
          else
            echo "Migration directory $MIGRATION_DIR does not exist"
          fi

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -q \
            --ignore=tests/test_copilot_api.py \
            --ignore=tests/test_reasoner_integration.py \
            --junitxml=pytest-report.xml 2>&1 | tee pytest-output.txt
          exit ${PIPESTATUS[0]}
        env:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          retention-days: 7
