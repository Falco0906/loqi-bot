services:
  - type: web
    name: loqi-backend
    runtime: python
    # The synthetic provider dataset lives at the repository root. Build from
    # the repository root so production contains the same provider assets as
    # the local vertical-slice runtime.
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
