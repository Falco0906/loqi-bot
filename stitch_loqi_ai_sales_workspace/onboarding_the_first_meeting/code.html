<style>
      .fade-in {
        animation: fadeIn 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .fade-in-delayed {
        opacity: 0;
        animation: fadeIn 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      }
      body {
        background-color: #fdf8f8; /* surface */
        -webkit-font-smoothing: antialiased;
      }
      .letter-texture {
        background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        opacity: 0.03;
        pointer-events: none;
      }
    </style>

<body class="min-h-screen flex flex-col font-body-md text-on-surface selection:bg-primary-fixed">
<!-- Subtle texture overlay for premium paper feel -->
<div class="fixed inset-0 letter-texture z-0"></div>
<main class="flex-grow flex flex-col items-center relative z-10">
<!-- Brand Header (Minimal) -->
<header class="w-full pt-16 pb-section-gap flex justify-center fade-in">
<h1 class="font-headline-lg text-headline-lg tracking-tight text-primary">Loqi</h1>
</header>
<!-- Main Content Canvas -->
<div class="max-w-reading-width w-full px-gutter flex flex-col justify-center items-start flex-grow">
<div class="space-y-element-gap fade-in-delayed">
<!-- Loqi Message -->
<div class="space-y-8 font-headline-md text-headline-md text-on-surface italic leading-relaxed">
    <h2 class="font-headline-lg text-headline-lg not-italic mb-8">Loqi</h2>
    <p class="fade-in">Good evening.</p>
    <p class="fade-in-delayed">I'm Loqi.</p>
    <p class="fade-in-delayed">I'll be your AI Sales Executive.</p>
    <p class="fade-in-delayed">Before I make decisions on your behalf, I'd like to understand your business.</p>
    <p class="fade-in-delayed">Think of this as our first strategy meeting.</p>
</div>
<!-- CTA Section -->
<div class="pt-section-gap">
<button class="group flex items-center gap-4 transition-all duration-500 ease-out active:scale-95">
<span class="bg-primary text-on-primary px-10 py-5 rounded-full font-label-sm text-label-sm uppercase tracking-widest hover:bg-on-surface-variant transition-colors">Begin</span>
<div class="w-12 h-px bg-outline-variant group-hover:w-20 transition-all duration-500"></div>
<span class="material-symbols-outlined text-outline group-hover:translate-x-2 transition-transform duration-500" style="font-size: 20px;">arrow_forward</span>
</button>
</div>
</div>
</div>
<!-- Meta Information (Micro-copy) -->

</main>
<!-- Micro-interaction for the button hover -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.querySelector('button');
            const mainContent = document.querySelector('.max-w-reading-width');
            
            btn.addEventListener('click', () => {
                // Transition out effect
                mainContent.style.transition = 'all 1s ease-in-out';
                mainContent.style.opacity = '0';
                mainContent.style.transform = 'translateY(-20px)';
                
                setTimeout(() => {
                    // This would normally trigger a route change
                    console.log('Transitioning to onboarding flow...');
                }, 800);
            });
        });
    </script>
